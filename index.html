<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jardín Mágico 💛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #03050b;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .btn-wrapper {
            position: absolute;
            bottom: 8%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transition: opacity 0.5s ease;
        }
        button, .wa-btn {
            background: rgba(255, 215, 0, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffe55c;
            padding: 12px 30px;
            font-size: 0.9rem;
            font-weight: 500;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 240px;
        }
        button:hover, .wa-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        .wa-btn {
            border-color: rgba(37, 211, 102, 0.5);
            color: #25d366;
            background: rgba(37, 211, 102, 0.12);
        }
        .wa-btn:hover {
            background: rgba(37, 211, 102, 0.25);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
        }
        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="btn-wrapper" id="btnWrapper">
        <button id="actionBtn">Construir Ramo</button>
        <a id="waShareBtn" class="wa-btn" href="#" target="_blank">Enviar por WhatsApp</a>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const actionBtn = document.getElementById('actionBtn');
        const btnWrapper = document.getElementById('btnWrapper');
        const waShareBtn = document.getElementById('waShareBtn');

        // Enlace directo configurado para WhatsApp
        const mensajeWhatsApp = encodeURIComponent("¡Hola! Te comparto este jardín mágico interactivo con mariposas reales que arman un ramo de flores 💛. ¡Míralo aquí!");
        waShareBtn.href = `https://api.whatsapp.com/send?text=${mensajeWhatsApp}`;

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let state = 'IDLE';
        let animationProgress = 0;
        let particles = [];
        let fireflies = [];

        const colors = [
            { primary: '#ff3366', dark: '#800f2f', glow: '#ff758f' },
            { primary: '#00b4d8', dark: '#03045e', glow: '#90e0ef' },
            { primary: '#7209b7', dark: '#3a0ca3', glow: '#b5179e' },
            { primary: '#ffb703', dark: '#d48c08', glow: '#ffd166' },
            { primary: '#2ec4b6', dark: '#014f86', glow: '#cbf3f0' }
        ];

        const flowerPositions = [
            {x: 0, y: -40},    // 0: Flor central
            {x: -45, y: -5},   // 1: Izquierda
            {x: 45, y: -5},    // 2: Derecha
            {x: -25, y: -80},  // 3: Arriba Izq
            {x: 25, y: -80},   // 4: Arriba Der
            {x: 0, y: -110}    // 5: Arriba
        ];

        let butterflies = [];
        for (let i = 0; i < 20; i++) {
            let isBuilder = i < flowerPositions.length;
            butterflies.push({
                x: Math.random() * width,
                y: Math.random() * height,
                targetX: 0,
                targetY: 0,
                freeAngle: Math.random() * Math.PI * 2,
                size: Math.random() * 12 + 40,
                speed: Math.random() * 2.5 + 2.0,
                wingSpeed: Math.random() * 0.25 + 0.18,
                offset: Math.random() * 100,
                colorObj: colors[Math.floor(Math.random() * colors.length)],
                isBuilder: isBuilder,
                flowerIndex: isBuilder ? i : -1,
                hasDelivered: false
            });
        }

        for(let i = 0; i < 60; i++) {
            fireflies.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.5,
                speed: Math.random() * 0.02,
                angle: Math.random() * Math.PI * 2
            });
        }

        window.addEventListener('pointerdown', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 1) * -3 - 1,
                    size: Math.random() * 8 + 4,
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.01,
                    color: colors[Math.floor(Math.random() * colors.length)].glow,
                    isHeart: true
                });
            }
        });

        actionBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (state === 'IDLE' || state === 'COMPLETED') {
                state = 'BUILDING';
                animationProgress = 0;
                btnWrapper.classList.add('fade-out');

                const centerX = width / 2;
                const centerY = height / 2 + 50;

                butterflies.forEach((b) => {
                    b.hasDelivered = false;
                    if (b.isBuilder) {
                        let pos = flowerPositions[b.flowerIndex];
                        b.targetX = centerX + pos.x * 2.5;
                        b.targetY = centerY + pos.y * 2.5;
                    }
                });
            }
        });

        function spawnSnapParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    alpha: 1,
                    decay: 0.03,
                    color: color,
                    isHeart: false
                });
            }
        }

        function drawButterflyShape(ctx, x, y, size, colorObj, wingScale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.shadowBlur = 18;
            ctx.shadowColor = colorObj.glow;

            // Alas superiores
            ctx.save();
            ctx.scale(Math.abs(wingScale), 1);
            
            let wingGrad = ctx.createLinearGradient(0, -size, 0, 0);
            wingGrad.addColorStop(0, colorObj.primary);
            wingGrad.addColorStop(1, colorObj.dark);
            ctx.fillStyle = wingGrad;

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size * 0.4, -size * 0.2, -size * 1.4, -size * 0.9, -size * 1.2, -size * 0.4);
            ctx.bezierCurveTo(-size * 1.0, -size * 0.1, -size * 0.4, size * 0.1, 0, 0);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(-size * 0.7, -size * 0.4, size * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-size * 0.9, -size * 0.3, size * 0.07, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = wingGrad;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(size * 0.4, -size * 0.2, size * 1.4, -size * 0.9, size * 1.2, -size * 0.4);
            ctx.bezierCurveTo(size * 1.0, -size * 0.1, size * 0.4, size * 0.1, 0, 0);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.globalAlpha = 0.8;
            ctx.beginPath();
            ctx.arc(size * 0.7, -size * 0.4, size * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(size * 0.9, -size * 0.3, size * 0.07, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.restore();

            // Alas inferiores
            ctx.save();
            ctx.scale(Math.abs(wingScale), 1);
            ctx.fillStyle = colorObj.primary;
            
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size * 0.3, size * 0.1, -size * 1.0, size * 0.4, -size * 0.8, size * 0.9);
            ctx.bezierCurveTo(-size * 0.5, size * 1.0, -size * 0.1, size * 0.5, 0, 0);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(size * 0.3, size * 0.1, size * 1.0, size * 0.4, size * 0.8, size * 0.9);
            ctx.bezierCurveTo(size * 0.5, size * 1.0, size * 0.1, size * 0.5, 0, 0);
            ctx.fill();
            ctx.restore();

            // Cuerpo y antenas
            ctx.fillStyle = '#111111';
            ctx.beginPath();
            ctx.ellipse(0, 0, size * 0.08, size * 0.5, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.45);
            ctx.quadraticCurveTo(-size * 0.25, -size * 0.75, -size * 0.35, -size * 0.8);
            ctx.moveTo(0, -size * 0.45);
            ctx.quadraticCurveTo(size * 0.25, -size * 0.75, size * 0.35, -size * 0.8);
            ctx.stroke();

            ctx.restore();
        }

        function drawHeart(ctx, x, y, size, color, alpha) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(0, topCurveHeight);
            ctx.bezierCurveTo(0, 0, size * 0.5, 0, size * 0.5, topCurveHeight);
            ctx.bezierCurveTo(size * 0.5, 0, size, 0, size, topCurveHeight);
            ctx.bezierCurveTo(size, size * 0.5, size * 0.5, size * 0.85, 0, size);
            ctx.bezierCurveTo(-size * 0.5, size * 0.85, -size, size * 0.5, -size, topCurveHeight);
            ctx.bezierCurveTo(-size, 0, -size * 0.5, 0, 0, topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.fillStyle = '#03050b';
            ctx.fillRect(0, 0, width, height);

            fireflies.forEach(f => {
                f.angle += f.speed;
                f.x += Math.cos(f.angle) * 0.2;
                f.y += Math.sin(f.angle) * 0.2;
                if(f.x < 0) f.x = width; if(f.x > width) f.x = 0;
                if(f.y < 0) f.y = height; if(f.y > height) f.y = 0;
                ctx.save();
                ctx.fillStyle = '#fff';
                ctx.globalAlpha = f.alpha + Math.sin(Date.now() * 0.003 + f.x) * 0.2;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI*2);
                ctx.fill();
                ctx.restore();
            });

            if (state === 'BUILDING') {
                animationProgress += 0.0035;
                if (animationProgress >= 1) {
                    state = 'COMPLETED';
                    actionBtn.innerText = "🔄 Reiniciar";
                    btnWrapper.classList.remove('fade-out');
                    
                    let centerX = width / 2;
                    let centerY = height / 2 + 50;
                    spawnSnapParticles(centerX, centerY, '#ffd100');
                }
            }

            let buildP = state === 'COMPLETED' ? 1 : Math.min(1, animationProgress);
            if (buildP > 0) {
                let centerX = width / 2;
                let centerY = height / 2 + 50;

                ctx.save();
                ctx.translate(centerX, centerY);
                let scale = 2.5;
                ctx.scale(scale, scale);

                let stemP = Math.min(1, buildP / 0.4);
                if (stemP > 0) {
                    let stemGrad = ctx.createLinearGradient(0, 0, 0, 75);
                    stemGrad.addColorStop(0, '#2d6a4f');
                    stemGrad.addColorStop(1, '#1b4332');

                    ctx.strokeStyle = stemGrad;
                    ctx.lineWidth = 9;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(0, 5);
                    ctx.quadraticCurveTo(3, 35, 0, 75 * stemP);
                    ctx.stroke();

                    if (stemP > 0.8) {
                        ctx.fillStyle = '#ffd166';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#d48c08';
                        ctx.beginPath(); ctx.ellipse(0, 50, 16, 8, 0, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(-12, 53); ctx.quadraticCurveTo(-28, 68, -20, 80);
                        ctx.moveTo(12, 53); ctx.quadraticCurveTo(28, 68, 20, 80);
                        ctx.lineWidth = 4;
                        ctx.strokeStyle = '#ffd166';
                        ctx.stroke();
                    }
                }

                let activeFlowersCount = Math.floor(buildP * flowerPositions.length * 1.3);
                
                flowerPositions.forEach((fl, idx) => {
                    if (idx <= activeFlowersCount) {
                        ctx.save();
                        ctx.translate(fl.x, fl.y);

                        for (let i = 0; i < 12; i++) {
                            ctx.save();
                            ctx.rotate((Math.PI * 2 / 12) * i + 0.15);
                            let gradBack = ctx.createRadialGradient(0, -28, 2, 0, -28, 24);
                            gradBack.addColorStop(0, '#d48c08');
                            gradBack.addColorStop(1, '#9d0208');
                            ctx.fillStyle = gradBack;
                            ctx.beginPath();
                            ctx.ellipse(0, -26, 8, 22, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }

                        for (let i = 0; i < 12; i++) {
                            ctx.save();
                            ctx.rotate((Math.PI * 2 / 12) * i);
                            let grad = ctx.createRadialGradient(0, -25, 1, 0, -25, 22);
                            grad.addColorStop(0, '#fff3b0');
                            grad.addColorStop(0.4, '#ffd100');
                            grad.addColorStop(1, '#f77f00');
                            ctx.fillStyle = grad;
                            ctx.shadowBlur = 18;
                            ctx.shadowColor = 'rgba(255, 209, 0, 0.7)';
                            ctx.beginPath();
                            ctx.ellipse(0, -24, 7, 21, 0, 0, Math.PI * 2);
                            ctx.fill();
                            ctx.restore();
                        }

                        let centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, 12);
                        centerGrad.addColorStop(0, '#ffe55c');
                        centerGrad.addColorStop(0.6, '#7f4f24');
                        centerGrad.addColorStop(1, '#381d02');
                        ctx.fillStyle = centerGrad;
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = '#d4a373';
                        ctx.beginPath();
                        ctx.arc(0, 0, 12, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.restore();
                    }
                });

                ctx.restore();
            }

            butterflies.forEach((b) => {
                if (state === 'IDLE') {
                    b.x += Math.cos(b.freeAngle) * b.speed;
                    b.y += Math.sin(b.freeAngle) * b.speed;
                    b.freeAngle += (Math.random() - 0.5) * 0.2;
                } else if (state === 'BUILDING') {
                    if (!b.isBuilder || (animationProgress * flowerPositions.length < b.flowerIndex)) {
                        b.x += Math.cos(b.freeAngle) * b.speed;
                        b.y += Math.sin(b.freeAngle) * b.speed;
                        b.freeAngle += (Math.random() - 0.5) * 0.2;
                    } else {
                        let dx = b.targetX - b.x;
                        let dy = b.targetY - b.y;
                        b.x += dx * 0.06;
                        b.y += dy * 0.06;

                        if (Math.hypot(dx, dy) < 8 && !b.hasDelivered) {
                            b.hasDelivered = true;
                            spawnSnapParticles(b.x, b.y, b.colorObj.glow);
                        }
                    }
                } else if (state === 'COMPLETED') {
                    b.hasDelivered = true;
                }

                if (b.hasDelivered || !b.isBuilder) {
                    if (state === 'COMPLETED' || state === 'BUILDING') {
                        b.x += Math.cos(b.freeAngle) * b.speed;
                        b.y += Math.sin(b.freeAngle) * b.speed;
                        b.freeAngle += (Math.random() - 0.5) * 0.15;
                    }
                }

                if (b.x < 50) { b.x = 50; b.freeAngle = Math.PI - b.freeAngle; }
                if (b.x > width - 50) { b.x = width - 50; b.freeAngle = Math.PI - b.freeAngle; }
                if (b.y < 50) { b.y = 50; b.freeAngle = -b.freeAngle; }
                if (b.y > height - 50) { b.y = height - 50; b.freeAngle = -b.freeAngle; }

                if (Math.random() < 0.3) {
                    particles.push({
                        x: b.x,
                        y: b.y,
                        vx: (Math.random() - 0.5) * 1,
                        vy: (Math.random() - 0.5) * 1,
                        size: Math.random() * 3 + 1,
                        alpha: 0.8,
                        decay: 0.03,
                        color: b.colorObj.glow,
                        isHeart: false
                    });
                }

                let wingScale = Math.sin(Date.now() * b.wingSpeed + b.offset);
                drawButterflyShape(ctx, b.x, b.y, b.size, b.colorObj, wingScale);
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= p.decay;

                if (p.isHeart) {
                    drawHeart(ctx, p.x, p.y, p.size, p.color, Math.max(0, p.alpha));
                } else {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                if (p.alpha <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
    </script>
</body>
</html>
